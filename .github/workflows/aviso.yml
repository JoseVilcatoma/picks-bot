name: Aviso de prensa

# Manda a Telegram el contenido de avisos/noticias.txt cada vez que cambia
# (lo escribe la tarea diaria de Claude que busca noticias de rotación).
on:
  push:
    branches: [main]
    paths: ["avisos/noticias.txt"]

permissions:
  contents: read

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_CHAT_ROTACIONES: ${{ secrets.TELEGRAM_CHAT_ROTACIONES }}
    steps:
      - uses: actions/checkout@v5
      - name: Enviar a Telegram
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request
          texto = open("avisos/noticias.txt", encoding="utf-8").read().strip()[:3900]
          chat = os.environ.get("TELEGRAM_CHAT_ROTACIONES") or os.environ["TELEGRAM_CHAT_ID"]
          url = f"https://api.telegram.org/bot{os.environ['TELEGRAM_TOKEN']}/sendMessage"
          def mandar(datos):
              req = urllib.request.Request(url, json.dumps(datos).encode(), {"Content-Type": "application/json"})
              try:
                  return urllib.request.urlopen(req, timeout=30).status
              except urllib.error.HTTPError as e:
                  print("Telegram respondió", e.code, e.read()[:300])
                  return e.code
          if not texto:
              sys.exit("avisos/noticias.txt está vacío")
          base = {"chat_id": chat, "disable_web_page_preview": True}
          if mandar({**base, "text": texto, "parse_mode": "HTML"}) != 200:
              if mandar({**base, "text": re.sub(r"<[^>]+>", "", texto)}) != 200:
                  sys.exit("no se pudo enviar")
          print("enviado")
          PY
