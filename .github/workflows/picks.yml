name: Picks

# El bot queda encendido vigilando (una pasada cada 2 min durante ~5.5 h) y antes de
# terminar se relanza solo. El horario de abajo es solo un respaldo por si la cadena se corta.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      probar:
        description: "ID de partido para una prueba (vacío = vigilante normal)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

# Las pruebas corren aparte para no esperar al vigilante.
concurrency:
  group: ${{ github.event.inputs.probar && format('prueba-{0}', github.run_id) || 'vigilante' }}
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      BANCA: ${{ vars.BANCA }}
      PAGINA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt

      - name: Prueba de un partido
        if: ${{ github.event.inputs.probar }}
        run: python picks_bot.py --probar "${{ github.event.inputs.probar }}"

      - name: Vigilante (pasada cada 2 min)
        if: ${{ !github.event.inputs.probar }}
        run: python -u picks_bot.py --vigilar 330

      - name: Relanzar el vigilante
        if: ${{ always() && !github.event.inputs.probar }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run picks.yml --ref main || echo "no se pudo relanzar (el horario de respaldo lo hará)"
