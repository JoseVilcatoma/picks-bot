name: Rotaciones (prueba)

# Prueba sin enviar a Telegram: deja el resultado en rot-diag.txt de la rama de pruebas.
on:
  push:
    branches: ["claude/rotaciones"]

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u rotaciones.py --diag > rot-diag.txt 2>&1 || true
      - run: |
          git config user.name "picks-bot"
          git config user.email "picks-bot@users.noreply.github.com"
          git add -f rot-diag.txt
          git commit -q -m "diagnóstico [skip ci]" && git push -q
