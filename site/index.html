<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario de Picks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ec; --panel:#ffffff; --ink:#16181d; --muted:#6b6f78; --line:#e3e0d8;
  --accent:#0f7a4a; --accent-ink:#ffffff; --chip:#e9e6de; --follow:#e8f4ee;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101214; --panel:#181b1f; --ink:#eceae4; --muted:#8d929b; --line:#262a30;
    --accent:#2fbf7f; --accent-ink:#06140d; --chip:#22262b; --follow:#14271e;
  }
}
:root[data-theme="dark"]{
  --bg:#101214; --panel:#181b1f; --ink:#eceae4; --muted:#8d929b; --line:#262a30;
  --accent:#2fbf7f; --accent-ink:#06140d; --chip:#22262b; --follow:#14271e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
header h1{font:700 34px/1 "Barlow Condensed",sans-serif;letter-spacing:.5px;margin:0 0 4px;text-transform:uppercase}
header p{margin:0;color:var(--muted);font-size:13px}
.dias{display:flex;gap:6px;margin:20px 0 10px;overflow-x:auto;padding-bottom:4px}
.dia{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;
  padding:8px 14px;cursor:pointer;font:600 14px Inter,sans-serif;text-align:center;min-width:76px}
.dia small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.dia[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dia[aria-pressed="true"] small{color:inherit;opacity:.7}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:0;background:var(--chip);color:var(--ink);border-radius:99px;padding:6px 12px;cursor:pointer;font:500 13px Inter,sans-serif}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.liga{margin:0 0 18px}
.liga h2{display:flex;align-items:center;gap:8px;font:700 18px/1 "Barlow Condensed",sans-serif;
  text-transform:uppercase;letter-spacing:.4px;margin:0 0 8px;color:var(--muted)}
.liga h2 img{width:20px;height:20px;object-fit:contain}
.p{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.p.sig{background:var(--follow);border-color:var(--accent)}
.hora{font:700 20px/1 "Barlow Condensed",sans-serif}
.eq{display:flex;flex-direction:column;gap:3px;min-width:0}
.eq span{display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq img{width:18px;height:18px;object-fit:contain;flex:0 0 18px}
.btn{border:0;border-radius:9px;padding:8px 12px;font:600 13px Inter,sans-serif;background:var(--accent);
  color:var(--accent-ink);text-decoration:none;white-space:nowrap}
.btn.pend{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.aviso{background:#c0392b;color:#fff;border-radius:10px;padding:10px 14px;margin:14px 0;font-size:14px}
.btn.ok{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.vacio{color:var(--muted);text-align:center;padding:40px 0}
footer{color:var(--muted);font-size:12px;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Calendario de picks</h1>
    <p id="info">Cargando partidos…</p>
  </header>
  <div id="aviso"></div>
  <div class="dias" id="dias"></div>
  <div class="filtros" id="filtros"></div>
  <main id="lista"></main>
  <footer>Toca <b>Seguir</b>: se abre Telegram, pulsa <b>Iniciar</b> y el bot te enviará los picks cuando salgan las alineaciones.
  El estado “Siguiendo” se actualiza en unos minutos.</footer>
</div>
<script>
const TZ = "America/Lima";
const IMG = (tipo, id, v) => `https://imagecache.365scores.com/image/upload/f_png,w_48,h_48,c_limit,q_auto:eco,dpr_2,d_${tipo}:default1.png/v${v||1}/${tipo}/${id}`;
const fmtDia = new Intl.DateTimeFormat("es-PE",{timeZone:TZ,weekday:"short",day:"2-digit",month:"2-digit"});
const fmtHora = new Intl.DateTimeFormat("es-PE",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:false});
const claveDia = d => new Intl.DateTimeFormat("en-CA",{timeZone:TZ}).format(d);
let datos = {partidos:[]}, seguidos = {}, diaSel = null, grupoSel = "Todas";
let pendientes = {};
try{ pendientes = JSON.parse(localStorage.getItem("pendientes")||"{}") }catch(e){}
function marcarPendiente(id){ pendientes[id]=Date.now(); try{localStorage.setItem("pendientes",JSON.stringify(pendientes))}catch(e){} }

function repoRaw(){
  const owner = location.hostname.split(".")[0];
  const repo = location.pathname.split("/").filter(Boolean)[0];
  return owner && repo ? `https://raw.githubusercontent.com/${owner}/${repo}/main/data/seguidos.json?t=${Date.now()}` : null;
}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function render(){
  const ps = datos.partidos;
  const dias = [...new Set(ps.map(p=>claveDia(new Date(p.inicio))))];
  if(!diaSel || !dias.includes(diaSel)) diaSel = dias[0];
  const hoy = claveDia(new Date());
  document.getElementById("dias").innerHTML = dias.map(d=>{
    const f = new Date(d+"T12:00:00-05:00");
    const lbl = d===hoy ? "Hoy" : fmtDia.format(f).split(",")[0];
    const n = ps.filter(p=>claveDia(new Date(p.inicio))===d).length;
    return `<button class="dia" aria-pressed="${d===diaSel}" data-d="${d}">${esc(lbl)}<small>${fmtDia.format(f).split(",").pop().trim()} · ${n}</small></button>`;
  }).join("");
  const delDia = ps.filter(p=>claveDia(new Date(p.inicio))===diaSel);
  const grupos = ["Todas", ...new Set(delDia.map(p=>p.grupo))];
  if(!grupos.includes(grupoSel)) grupoSel = "Todas";
  document.getElementById("filtros").innerHTML = grupos.map(g=>`<button class="chip" aria-pressed="${g===grupoSel}" data-g="${esc(g)}">${esc(g)}</button>`).join("");
  const vis = delDia.filter(p=>grupoSel==="Todas"||p.grupo===grupoSel);
  if(!vis.length){document.getElementById("lista").innerHTML='<p class="vacio">No hay partidos para este filtro.</p>';return}
  const porLiga = {};
  vis.forEach(p=>{(porLiga[p.liga] ||= []).push(p)});
  document.getElementById("lista").innerHTML = Object.entries(porLiga).map(([liga,lista])=>`
    <section class="liga"><h2><img src="${IMG("Competitions",lista[0].liga_id,1)}" alt="" onerror="this.remove()">${esc(liga)}</h2>
    ${lista.map(p=>{
      const sig = seguidos[String(p.id)];
      const pend = !sig && pendientes[p.id] && Date.now()-pendientes[p.id] < 30*60*1000;
      const link = `https://t.me/${datos.bot}?start=f${p.id}`;
      const boton = sig ? `<span class="btn ok">✓ Siguiendo</span>`
        : !datos.bot ? `<span class="btn pend">Bot no configurado</span>`
        : pend ? `<a class="btn pend" href="${link}" target="_blank" rel="noopener">⏳ Confirmar en Telegram</a>`
        : `<a class="btn" href="${link}" target="_blank" rel="noopener" data-seguir="${p.id}">Seguir</a>`;
      return `<div class="p ${sig?"sig":""}">
        <div class="hora">${fmtHora.format(new Date(p.inicio))}</div>
        <div class="eq">
          <span><img src="${IMG("Competitors",p.local_id,p.local_v)}" alt="" onerror="this.style.visibility='hidden'">${esc(p.local)}</span>
          <span><img src="${IMG("Competitors",p.visita_id,p.visita_v)}" alt="" onerror="this.style.visibility='hidden'">${esc(p.visita)}</span>
        </div>
        ${boton}
      </div>`}).join("")}
    </section>`).join("");
}

document.addEventListener("click",e=>{
  const d = e.target.closest("[data-d]"); if(d){diaSel=d.dataset.d; render()}
  const g = e.target.closest("[data-g]"); if(g){grupoSel=g.dataset.g; render()}
  const sg = e.target.closest("[data-seguir]"); if(sg){marcarPendiente(sg.dataset.seguir); setTimeout(render,300)}
});

(async()=>{
  try{
    datos = await (await fetch("fixtures.json?t="+Date.now())).json();
    const gen = new Date(datos.generado);
    document.getElementById("info").textContent = `${datos.partidos.length} partidos · actualizado ${fmtDia.format(gen)} ${fmtHora.format(gen)}`;
  }catch(e){document.getElementById("info").textContent="No se pudo cargar el calendario."}
  if(!datos.bot && datos.partidos.length){
    document.getElementById("aviso").innerHTML = '<div class="aviso">⚠️ El calendario no conoce el nombre de tu bot. Revisa que el secreto <b>TELEGRAM_TOKEN</b> esté bien escrito en GitHub y vuelve a correr <b>Actions → Calendario → Run workflow</b>.</div>';
  }
  try{const u=repoRaw(); if(u){const r=await fetch(u); if(r.ok) seguidos=await r.json()}}catch(e){}
  render();
})();
</script>
</body>
</html>
